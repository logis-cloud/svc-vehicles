# Compose de DESARROLLO LOCAL: levanta Postgres + el API en el mismo host,
# para probar sin depender de las VMs reales. No se usa en producción.
services:
  db-vehiculos:
    image: postgres:16-alpine
    container_name: db-vehiculos
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-vehiculos_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - db_vehiculos_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ms-vehiculos:
    build: .
    container_name: ms-vehiculos
    restart: unless-stopped
    depends_on:
      db-vehiculos:
        condition: service_healthy
    environment:
      # Acá SÍ usamos el nombre del contenedor como DB_HOST porque ambos
      # servicios comparten la red por defecto de este compose local.
      DB_HOST: db-vehiculos
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-vehiculos_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      SEED_ENABLED: ${SEED_ENABLED:-false}
    ports:
      - "8002:8080"

volumes:
  db_vehiculos_data:
