server:
  port: 8080

spring:
  application:
    name: ms-vehicles
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vehicles_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Sin esto, si la BD no responde en el primer intento, Hikari lanza
      # una excepción al armar el pool y Spring Boot aborta el arranque
      # (el contenedor muere). Con -1, el pool se crea igual y hace los
      # intentos de conexión reales en segundo plano, cada vez que algo
      # (ej. la validación de schema de Hibernate) pide una conexión.
      initialization-fail-timeout: -1

      # Cuánto espera cada intento individual de conexión antes de fallar
      # y reintentar. 30s le da margen a MySQL/Postgres para terminar su
      # inicialización de primer arranque (creación de tablas vía initdb.d).
      connection-timeout: 30000

      # Reintentos periódicos del pool mientras no logra conectar.
      keepalive-time: 30000

  jpa:
    hibernate:
      # El schema (tablas, secuencias) lo crea un script SQL propio en la VM
      # de base de datos, no esta app. "validate" solo verifica que las
      # entidades calcen con lo que ya existe y falla con un mensaje claro
      # si no, en vez de intentar alterar tablas que no le pertenecen.
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # --- Batching habilitado: optimiza las inserciones y actualizaciones masivas en Hibernate.
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true
  jackson:
    default-property-inclusion: non_null

springdoc:
  swagger-ui:
    path: /docs
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

management:
  endpoints:
    web:
      exposure:
        include: health,info
