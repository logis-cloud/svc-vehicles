server:
  port: 8080

spring:
  application:
    name: ms-vehiculos
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vehiculos_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # --- Batching habilitado: sin esto, saveAll() hace un INSERT por fila,
        # lo cual es demasiado lento para los 20,000+ registros del seed.
        # Equivale en espíritu al bulk_insert_mappings que usa el microservicio
        # de Clientes (Python/SQLAlchemy) para el mismo propósito.
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true
  jackson:
    default-property-inclusion: non_null

springdoc:
  swagger-ui:
    path: /docs
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

app:
  seed:
    enabled: ${SEED_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
