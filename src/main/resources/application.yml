server:
  port: 8080

spring:
  application:
    name: ms-vehiculos
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vehiculos_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    default-property-inclusion: non_null

springdoc:
  swagger-ui:
    path: /docs
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

app:
  seed:
    enabled: ${SEED_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
